<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>比例换算 · 兰博设计摊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="ratio-converter" data-page="ratio-converter">
<div class="app">
  <main class="main">
    <div class="content">

      <a class="back-bar" href="toolbox.html"><img src="assets/icons/i-arrow-back.svg" alt="">返回工具箱</a>

      <!-- 标题区 -->
      <section class="rc-head">
        <span class="kicker">TOOLBOX / RATIO CALCULATOR</span>
        <h1 class="h-page-title">比例换算</h1>
        <p class="rc-head__desc">输入任意尺寸与目标比例，快速换算等比缩放结果，支持常用比例预设与自定义输入，全程本地计算。</p>
      </section>

      <!-- 工作区 -->
      <section class="rc-work">

        <!-- 原始尺寸 -->
        <div class="rc-field">
          <span class="rc-field__label">原始尺寸</span>
          <div class="rc-size-row">
            <label class="rc-size">
              <span class="rc-size__label">宽度 W（px）</span>
              <input type="number" id="rcW" value="1920" min="1" max="99999" inputmode="numeric" aria-label="宽度（像素）">
            </label>
            <span class="rc-times" aria-hidden="true">×</span>
            <label class="rc-size">
              <span class="rc-size__label">高度 H（px）</span>
              <input type="number" id="rcH" value="1080" min="1" max="99999" inputmode="numeric" aria-label="高度（像素）">
            </label>
          </div>
        </div>

        <!-- 目标比例：预设 chips -->
        <div class="rc-field">
          <span class="rc-field__label">常用比例</span>
          <div class="rc-chips" id="rcChips" role="group" aria-label="常用比例预设">
            <button class="rc-chip" type="button" data-w="1" data-h="1">1:1</button>
            <button class="rc-chip" type="button" data-w="4" data-h="3">4:3</button>
            <button class="rc-chip is-active" type="button" data-w="16" data-h="9">16:9</button>
            <button class="rc-chip" type="button" data-w="16" data-h="10">16:10</button>
            <button class="rc-chip" type="button" data-w="3" data-h="2">3:2</button>
            <button class="rc-chip" type="button" data-w="5" data-h="4">5:4</button>
            <button class="rc-chip" type="button" data-w="21" data-h="9">21:9</button>
            <button class="rc-chip" type="button" data-w="2" data-h="3">2:3</button>
            <button class="rc-chip" type="button" data-w="9" data-h="16">9:16</button>
            <button class="rc-chip" type="button" data-w="3" data-h="4">3:4</button>
          </div>
        </div>

        <!-- 说明条 -->
        <div class="rc-note">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.3"/><path d="M8 7V11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="4.8" r="0.9" fill="currentColor"/></svg>
          <span>换算规则：按基准边等比缩放，结果四舍五入取整；宽高比 = 目标宽 ÷ 目标高。所有计算均在本地完成，不会上传或存储任何输入内容。</span>
        </div>

      </section>

    </div>
  </main>
</div>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ratio-converter.js"></script>
</body>
</html>
