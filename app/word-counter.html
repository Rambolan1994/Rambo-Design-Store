<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字数统计 · 兰博设计摊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="word-counter" data-page="word-counter">
<div class="app">
  <main class="main">
    <div class="content">

      <a class="back-bar" href="toolbox.html"><img src="assets/icons/i-arrow-back.svg" alt="">返回工具箱</a>

      <!-- 标题区 -->
      <section class="wc-head">
        <span class="kicker">TOOLBOX / TEXT COUNTER</span>
        <h1 class="h-page-title">字数统计</h1>
        <p class="wc-head__desc">中英文字符、单词与段落实时统计，所有计算均在本地完成，不上传任何内容。</p>
      </section>

      <!-- 工作区 -->
      <section class="wc-work">

        <!-- 左：输入卡 -->
        <div class="wc-card wc-input">
          <div class="wc-card__head">
            <div class="wc-head-left">
              <span class="wc-dot"></span>
              <span class="wc-card__title">输入文本</span>
            </div>
            <span class="wc-badge is-idle" id="wcBadge">等待输入</span>
          </div>
          <div class="wc-input__area">
            <textarea id="wcText" maxlength="5000" spellcheck="false" aria-label="输入要统计的文本" placeholder="在这里输入或粘贴要统计的文本…&#10;支持中英文混排，所有内容仅在本地计算。"></textarea>
          </div>
          <div class="wc-card__foot">
            <div class="wc-btns">
              <button class="wc-btn" type="button" id="wcPaste">粘贴</button>
              <button class="wc-btn" type="button" id="wcCopy"><span id="wcCopyLabel">复制文本</span></button>
              <button class="wc-btn wc-btn--ghost" type="button" id="wcClear">清空</button>
            </div>
            <span class="wc-counter" id="wcCounter">0 / 5000 字符</span>
          </div>
        </div>

        <!-- 右：统计面板 -->
        <aside class="wc-stats">

          <div class="wc-hero">
            <span class="wc-hero__label">总字符数</span>
            <strong class="wc-hero__num" id="sTotal">0</strong>
            <span class="wc-hero__sub">包含空格与标点</span>
          </div>

          <div class="wc-metrics">
            <div class="wc-metric"><span class="wc-metric__label">中文字</span><strong class="wc-metric__num" id="sChinese">0</strong></div>
            <div class="wc-metric"><span class="wc-metric__label">英文单词</span><strong class="wc-metric__num" id="sWords">0</strong></div>
            <div class="wc-metric"><span class="wc-metric__label">数字</span><strong class="wc-metric__num" id="sNumbers">0</strong></div>
            <div class="wc-metric"><span class="wc-metric__label">段落数</span><strong class="wc-metric__num" id="sParagraphs">0</strong></div>
          </div>

          <div class="wc-card wc-detail">
            <div class="wc-detail__row"><span>行数</span><span id="sLines">0 行</span></div>
            <div class="wc-detail__row"><span>标点符号</span><span id="sPunct">0</span></div>
            <div class="wc-detail__row"><span>空格数</span><span id="sSpaces">0</span></div>
            <div class="wc-detail__row"><span>预计阅读时间</span><span id="sRead" class="is-accent">约 0 分钟</span></div>
          </div>

          <button class="wc-copy-result" type="button" id="wcCopyResult">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 3.5H3.5C2.67 3.5 2 4.17 2 5V11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <span id="wcCopyResultLabel">复制统计结果</span>
          </button>

        </aside>
      </section>

      <!-- 说明条 -->
      <div class="wc-note">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.3"/><path d="M8 7V11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="4.8" r="0.9" fill="currentColor"/></svg>
        <span>统计口径：中文按单字计数，英文按单词计数，数字与标点单独统计；所有文本仅在浏览器本地计算，不会上传或存储。</span>
      </div>

    </div>
  </main>
</div>
<script src="assets/js/shell.js"></script>
<script src="assets/js/word-counter.js"></script>
</body>
</html>
