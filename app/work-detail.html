<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考证通 · 作品详情 · 兰博设计摊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="detail" data-page="work-detail">
<div class="app">
  <main class="main">
    <div class="content">

      <a class="back-bar" href="works.html"><img src="assets/icons/i-arrow.svg" alt="">返回作品列表</a>

      <!-- 项目 Hero -->
      <section class="hero-project" aria-label="项目概览">
        <div class="hero-project__cover"><img src="assets/covers/cover-zhengkaotong.png" alt="考证通 App 主视觉"></div>
        <div class="hero-project__body">
          <span class="featured-tag">年度精选 · 2026</span>
          <h1 class="hero-project__title">考证通 · 在线备考平台</h1>
          <p class="hero-project__desc">面向职业资格考试的一站式备考产品，让专注成为默认状态。</p>
          <div class="hero-actions">
            <a class="btn" href="#gallery">访问项目<span class="btn__arrow"><img src="assets/icons/i-arrow.svg" alt=""></span></a>
            <button class="btn btn--ghost" type="button" id="favBtn">收藏</button>
          </div>
        </div>
      </section>

      <!-- 元信息表 -->
      <section class="meta-table" aria-label="项目信息">
        <div class="meta-cell"><span class="meta-cell__k">我的角色</span><span class="meta-cell__v">UI/UX 设计 · 交互</span></div>
        <div class="meta-cell"><span class="meta-cell__k">项目周期</span><span class="meta-cell__v meta-cell__v--mono">2026.01 — 2026.04</span></div>
        <div class="meta-cell"><span class="meta-cell__k">平台</span><span class="meta-cell__v">iOS / Android</span></div>
        <div class="meta-cell"><span class="meta-cell__k">协作团队</span><span class="meta-cell__v">产品 × 设计 × 研发</span></div>
      </section>

      <!-- 图片流（原正文三块 → 三张作品展示图） -->
      <section class="image-flow" id="gallery" aria-label="作品展示">
        <div class="image-flow__item"><img src="assets/covers/cover-zhengkaotong.png" alt="项目主视觉"></div>
        <div class="image-flow__item"><img src="assets/covers/cover-dashboard.png" alt="挑战与方案展示"></div>
        <div class="image-flow__item"><img src="assets/covers/cover-knowledge.png" alt="设计亮点展示"></div>
      </section>

      <!-- 成果数据 -->
      <section class="impact" aria-label="项目成果">
        <span class="kicker">04 / IMPACT</span>
        <div class="impact__row">
          <div class="impact__cell"><span class="impact__num">+38%</span><span class="impact__label">日均学习时长</span></div>
          <div class="impact__cell"><span class="impact__num">4.9 / 5</span><span class="impact__label">应用商店评分</span></div>
          <div class="impact__cell"><span class="impact__num">12 万+</span><span class="impact__label">累计用户</span></div>
        </div>
      </section>

      <!-- 技术栈 -->
      <section class="stack-row" aria-label="技术栈">
        <span class="stack-row__label">技术栈 / STACK</span>
        <div class="stack-row__tags">
          <span class="chip chip--blue chip--mono">Figma</span>
          <span class="chip chip--green chip--mono">Vue 3</span>
          <span class="chip chip--mono">Design System</span>
          <span class="chip chip--mono">TypeScript</span>
        </div>
      </section>

      <!-- 项目间导航 -->
      <nav class="project-nav" aria-label="项目间导航">
        <a class="project-nav__item" href="work-detail.html"><span class="project-nav__k">← 上一项目</span><span class="project-nav__t">年会抽奖系统</span></a>
        <a class="project-nav__item project-nav__item--next" href="work-detail.html"><span class="project-nav__k">下一项目 →</span><span class="project-nav__t">社交新零售 · 商城</span></a>
      </nav>

    </div>
  </main>
</div>
<script src="assets/js/shell.js"></script>
<script src="assets/js/interactions.js"></script>
<script>
document.getElementById('favBtn').addEventListener('click', function(){
  var on = this.textContent.trim() === '已收藏';
  this.textContent = on ? '收藏' : '已收藏';
  this.style.color = on ? '' : 'var(--signal)';
});
</script>
</body>
</html>
